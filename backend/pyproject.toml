[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pertty_midi.*"
ignore_missing_imports = true
module = "matching.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]